name: Build Conan with Matrix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    strategy:
      fail-fast: false
      matrix:
        setuptools_version: [58.0.0, 59.0.1, 60.0.0, 61.1.0, 62.0.0, 63.0.0, 64.0.0, 65.0.1, 66.0.0, 67.0.0, 68.0.0, 69.0.0, 70.0.0, 71.0.0, 72.1.0, 73.0.1, 74.0.0, 75.0.0, 76.0.0, 77.0.1, 78.0.1, 79.0.0, 80.0.0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script for setuptools ${{ matrix.setuptools_version }}
        env:
          SETUPTOOLS_VERSION: ${{ matrix.setuptools_version }}
        run: ./build.sh
