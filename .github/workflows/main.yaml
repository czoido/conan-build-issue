name: Build Conan with Matrix (Pip & Setuptools)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    strategy:
      fail-fast: false # Keep running other jobs if one fails
      matrix:
        # Define Pip versions to test
        pip_version: ['21.2.4', '22.0.4', '23.0.1', '24.0', '25.1'] # Known failing, transitions, recent
        # Define Setuptools versions to test (shortened list, expand if needed)
        setuptools_version: ['58.0.4', '60.10.0', '61.0.0', '65.0.1', '69.0.0', '80.0.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script (pip ${{ matrix.pip_version }}, setuptools ${{ matrix.setuptools_version }})
        env:
          # Pass both versions from the matrix to the script
          PIP_VERSION: ${{ matrix.pip_version }}
          SETUPTOOLS_VERSION: ${{ matrix.setuptools_version }}
        run: ./build.sh